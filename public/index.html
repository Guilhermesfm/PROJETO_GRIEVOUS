<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta de Placas</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --panel-soft: #eef4ff;
        --line: #dfe7f4;
        --text: #1e2a3a;
        --muted: #607086;
        --primary: #1d4ed8;
        --primary-dark: #1e3a8a;
        --success: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(180deg, #edf4ff 0%, #e6edf7 100%);
        color: var(--text);
      }

      .container {
        width: min(760px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 30px 28px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 2vw, 2.4rem);
        color: var(--text);
      }

      .subtitulo {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.98rem;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
      }

      textarea {
        width: 100%;
        min-height: 160px;
        resize: vertical;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fbfdff;
        color: var(--text);
        padding: 14px 16px;
        font-size: 1rem;
        line-height: 1.6;
        outline: none;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      textarea:focus {
        border-color: rgba(29, 78, 216, 0.55);
        box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.08);
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 18px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        color: white;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 8px 18px rgba(29, 78, 216, 0.25);
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      #status {
        flex: 1;
        min-height: 24px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.95rem;
      }

      #resultados {
        margin: 22px 0 0;
        padding-left: 20px;
        color: var(--text);
        line-height: 1.9;
      }

      li + li {
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Consulta de placas</h1>
      <p class="subtitulo">
        Informe as placas separadas por vírgula ou quebra de linha.
      </p>

      <label for="placas">Placas</label>
      <textarea
        id="placas"
        placeholder="Exemplo: ABC1234, XYZ5678, DEF9012"
      ></textarea>

      <div class="bar">
        <button id="btnExecutar">Executar</button>
        <div id="status">Aguardando execução...</div>
      </div>

      <ul id="resultados"></ul>
    </div>

    <script>
      // Captura os elementos visuais da tela.
      const placasInput = document.getElementById("placas");
      const btnExecutar = document.getElementById("btnExecutar");
      const status = document.getElementById("status");
      const resultados = document.getElementById("resultados");

      // Converte texto em lista de placas, aceitando vírgula ou quebra de linha.
      function parsePlacas(texto) {
        return texto
          .split(/[\n,]+/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      // Quando clicar em "Executar", envia as placas para a API e mostra o retorno.
      btnExecutar.addEventListener("click", async () => {
        const placas = parsePlacas(placasInput.value);
        status.textContent = "Executando automação...";
        btnExecutar.disabled = true;
        resultados.innerHTML = "";

        try {
          const response = await fetch("/api/run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ placas }),
          });

          const payload = await response.json();

          if (!response.ok || !payload.ok) {
            throw new Error(payload.error || "Erro ao executar automação.");
          }

          // Exibe o caminho do arquivo salvo e os resultados retornados.
          status.textContent = `Arquivo salvo em: ${payload.outputPath}`;

          payload.resultados.forEach((item) => {
            const li = document.createElement("li");
            li.textContent = `${item.Placa} | ${item.Situacao} | ${item["Data de criacao"]}`;
            resultados.appendChild(li);
          });
        } catch (error) {
          status.textContent = error.message;
        } finally {
          btnExecutar.disabled = false;
        }
      });
    </script>
  </body>
</html>
